
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品詳細 | K'shop</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product-detail.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-top">

      <a href="index.html" class="logo">
        <span>k</span>Shop
      </a>

    </div>
  </header>


  <!-- PRODUCT DETAIL -->
  <main class="detail-container">

    <!-- BACK TO HOME -->
    <a href="index.html" class="back-link">
      ← 商品一覧に戻る
    </a>


    <section class="detail-layout">

      <!-- PRODUCT IMAGE -->
      <div class="detail-image">
        <img id="detailImage" alt="商品画像">
      </div>


      <!-- PRODUCT INFORMATION -->
      <div class="detail-info">

        <h1 id="detailName">商品名</h1>

        <p id="detailShop">ショップ名</p>

        <p id="detailPrice">価格</p>

        <p id="detailStock">在庫情報</p>

        <div class="quantity-box">

          <label for="quantity">数量：</label>

          <input
            type="number"
            id="quantity"
            min="1"
            value="1"
          >

        </div>

        <button
          class="btn btn-primary"
          id="addCartButton"
          disabled
        >
          カートに入れる
        </button>

      </div>

    </section>


    <!-- PRODUCT DESCRIPTION -->
    <section class="detail-description">

      <h2>商品説明</h2>

      <p id="detailDescription">
        商品の説明がここに表示されます。
      </p>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">
    K'shop デモUI（学習用） - Anh Phuoc
  </footer>


  <!-- JAVASCRIPT -->
 
  <script src="product-detail.js"></script>

</body>
</html>
